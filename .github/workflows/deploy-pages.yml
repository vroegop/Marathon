name: Deploy site

# Builds site/ + data/ into _site/ and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the tip of the branch, not the commit that triggered the caller
          # (the sync workflow pushes a data commit first, then calls this workflow)
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
