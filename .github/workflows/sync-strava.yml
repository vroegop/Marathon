name: Sync Strava

# OPTIONAL path: pulls new activities from the Strava API into data/ and commits them.
# Does nothing until the three repository secrets exist: STRAVA_CLIENT_ID,
# STRAVA_CLIENT_SECRET, STRAVA_REFRESH_TOKEN (see README.md, "Optional: Strava API sync";
# note the subscription requirement and the API policy limits described there).
on:
  schedule:
    - cron: '23 3 * * *' # daily, 03:23 UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-list every activity (after editing sync.config.json, or to pick up renamed/deleted activities older than 30 days)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for Strava credentials
        id: creds
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        run: |
          if [ -z "$STRAVA_CLIENT_ID" ]; then
            echo "No STRAVA_* secrets configured; nothing to do (see README, 'Optional: Strava API sync')."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync activities from Strava
        id: sync
        if: steps.creds.outputs.configured == 'true'
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          FULL: ${{ inputs.full == true && '--full' || '' }}
        run: node scripts/strava-sync.mjs $FULL
      - name: Commit synced data
        id: commit
        if: steps.creds.outputs.configured == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: sync Strava activities" -m "$SUMMARY"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
