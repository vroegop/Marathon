name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so "today" in the plan (frozen history, missed sessions) stays current
  # even when nothing is pushed.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover tools
      - name: Build plan
        env:
          TZ: Europe/Amsterdam
        run: python tools/build_plan.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
