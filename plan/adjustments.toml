# Changes on top of plan.toml because life happened. Newest at the bottom.
#
# [[disruption]]  a period you could not train normally.
#   from, to      dates (inclusive)
#   kind          "sick" | "injury" | "life"
#   note          short description (shown on the site)
#   return_days   after `to`: runs are capped to easy pace and `return_volume` of planned km
#   return_volume fraction, default 0.6
#   Every running/strength/quality session inside the period becomes rest.
#
# [[override]]    replace the main session(s) of one day.
#   date
#   sessions      list of sessions as in plan.toml, e.g. [{ s = "easy", km = 5 }]; [] = rest
#   keep_cross    keep volleyball etc. on that day (default true)
#   note
#   reported      what Randy said they did (counts as done until the watch data says otherwise)
#
# Example:
# [[disruption]]
# from = "2026-12-01"
# to = "2026-12-05"
# kind = "sick"
# note = "Flu"
# return_days = 7

# ---- Week of 26 Oct 2026: knee niggle from the week before, almost gone.
[[override]]
date = "2026-10-26"
sessions = [{ s = "elliptical", mins = 30 }]
note = "Swapped for the elliptical to give the knee a rest."
reported = "30 min elliptical"

[[override]]
date = "2026-10-29"
sessions = [{ s = "easy", km = 5 }]
note = "Easy instead of the race-pace sharpener: the knee comes first this week. Skip the strides."

[[override]]
date = "2026-11-02"
sessions = [{ s = "elliptical", mins = 30 }]
note = "Day after the 10k: elliptical instead of a recovery run, kind to the knee."
