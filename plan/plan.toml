# The season plan. Every week is spelled out so changes are small, readable diffs.
#
# - races:     the goal events (shown as flags in the season profile).
# - phases:    training blocks; each week belongs to the phase whose date range contains it.
# - recurring: fixed weekly items (volleyball, Sunday mobility) between two dates; skipped on dates in `except`.
# - weeks:     one entry per Monday. Days: mon..sun. A day is one session or a list of them.
#              A session is { s = "<key in sessions.toml>", ...params } with optional
#              km, reps, mins, dist, pace (goal pace "m:ss" overriding the zone), note.
#              Strength: { s = "strength" } gets circuit A (first in the week) or B (second);
#              circuit = "T" for the light taper/travel circuit, rounds = 2 for lighter weeks.
#              Exercises live in strength.toml.
#
# Changes because of illness, injury or life go in adjustments.toml, not here, unless the
# whole block is being rewritten.

[[races]]
id = "10k"
name = "10k"
date = "2026-11-01"
km = 10
goal = "Under 50:00 (5:00/km)"
goal_pace = "5:00"
priority = "Benchmark"
notes = "A fitness check, not a peak. Start at 5:05 for the first 2 km, settle at 5:00, and if you still feel good at 7 km, push. Knee check: if it hurts during the warm-up or makes you change your stride, run it as an easy training run instead. The result sets the training paces for the Texel block."

[[races]]
id = "texel"
name = "Texel Trail"
date = "2027-02-06"
km = 24
goal = "Under 6:00/km (about 2:24)"
goal_pace = "6:00"
priority = "Milestone"
notes = "Beach and dune trails: sand slows everyone down, so judge pace on the firm parts and run by effort in soft sand. Stretch goal, no stress: a strong finish beats a fast start. The volleyball match on Friday 5 Feb: play light, early to bed."

[[races]]
id = "beerlovers"
name = "Beer Lovers Marathon"
date = "2027-05-16"
km = 42.2
goal = "Finish comfortably, together with the mates"
priority = "Milestone"
notes = "No time goal: run at easy-long-run effort and enjoy the tastings in moderation (water first!). Saturday at Nerdland: comfortable shoes, limit time on your feet, carb-rich dinner, early night."

[[races]]
id = "ironviking"
name = "Iron Viking"
date = "2027-09-25"
km = 42
goal = "Finish"
priority = "Milestone"
notes = "A marathon with obstacles: expect 6-8 hours. Pace by effort, eat every 45 min, keep your grip fresh by not over-gripping on the run sections. Trail shoes with good drainage, gloves optional."

[[phases]]
id = "race10k"
name = "10k race week"
start = "2026-10-26"
end = "2026-11-01"
focus = "Fresh legs for Sunday."
about = "Training volume drops, one short session at race pace on Thursday keeps the legs sharp, and Saturday is a shake-out."

[[phases]]
id = "reset"
name = "Reset"
start = "2026-11-02"
end = "2026-11-08"
focus = "Recover from the 10k, social weekend."
about = "Easy running only. The 10k result is entered as new fitness and the Texel block is paced from it."

[[phases]]
id = "texel"
name = "Texel build"
start = "2026-11-09"
end = "2027-01-31"
race = "texel"
focus = "Long runs to 22 km, threshold, hills and dunes."
about = """Twelve weeks that grow the long run from 12 to 22 km while adding one quality session a week.
Every fourth week is lighter so the body can absorb the work (and those weeks line up with your birthday and Christmas).
Strength twice a week from the start: Tuesday a circuit after the elliptical, Saturday after the easy run.
From January a fourth run comes in, because volleyball takes less of the week; strength moves to Tuesday (after the easy run) and Thursday (after the elliptical).
Specific work for Texel: dune long runs, hill repeats and race-pace blocks on sand."""

[[phases]]
id = "texel-taper"
name = "Texel taper"
start = "2027-02-01"
end = "2027-02-07"
race = "texel"
focus = "Freshen up and race."
about = "Volume down by half, a little race pace on Wednesday, nothing on Thursday and Friday except the match."

[[phases]]
id = "marathon"
name = "Marathon build"
start = "2027-02-08"
end = "2027-05-09"
race = "beerlovers"
focus = "Long runs to 32 km, durability and fuelling."
about = """After a recovery week, the long run grows from 16 to 32 km (peak on 19 April).
With no time goal, the quality work is about durability: tempo, hills and steady runs rather than marathon-pace sessions.
The wintersport week is a step-back week; Easter Monday hosts a big long run. Practise eating and drinking on every long run over 90 minutes."""

[[phases]]
id = "marathon-taper"
name = "Marathon week"
start = "2027-05-10"
end = "2027-05-16"
race = "beerlovers"
focus = "Rest, Nerdland, then 42 km with the mates."
about = "Short and easy. Saturday at the festival counts as rest day: sit when you can."

[[phases]]
id = "recover"
name = "Recovery & holiday"
start = "2027-05-17"
end = "2027-06-06"
focus = "Recover, enjoy the holiday."
about = "Three weeks without structure: easy runs when you feel like it, hikes, swims. This is where a marathon is absorbed."

[[phases]]
id = "ironviking"
name = "Iron Viking build"
start = "2027-06-07"
end = "2027-09-19"
race = "ironviking"
focus = "Trail long runs to 33 km, strength, grip and obstacles."
about = """Fifteen weeks to turn a marathon runner into an obstacle-course runner.
Long runs move to trails and grow to 33 km; Saturdays alternate trail runs with OCR circuits (run, burpees, hangs, carries).
The two weekly circuits (Tuesday and Thursday) keep the legs-and-pelvis work and add the grip and upper body that obstacles demand.
Every fourth week is lighter."""

[[phases]]
id = "ironviking-taper"
name = "Iron Viking week"
start = "2027-09-20"
end = "2027-09-25"
race = "ironviking"
focus = "Fresh for 42 km of mud."
about = "Easy running, no strength work after Tuesday."

