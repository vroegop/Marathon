# Strength, pelvis control and mobility.
#
# plan.toml schedules strength with { s = "strength" }: the first one in a week gets
# circuit A, the second circuit B (override with circuit = "B" or "T"; rounds = 2 for
# lighter weeks). The circuit's exercises come from the [[block]] whose dates contain the
# session, so editing a circuit here changes every future session; past days stay frozen.
#
# [exercise.<key>]  name, kit, focus, how, cues, why. Focus tags: legs, calves, pelvis,
#                   core, spring, upper, mobility.
# [[block]]         id, name, from, to, focus, about
# [[circuit]]       block (omit = usable in every block), id, name, rounds, items
#                   item: { x = "<exercise key>", reps = "...", kg = 9, tip = "..." }
# [warmup], [mobility]  routines: title + items (no kg)
# [[changed]]       what changed compared to Randy's own circuit, and why
#
# Temporarily swapping an exercise (knee trouble etc.) goes in adjustments.toml.

# ----------------------------------------------------------------------- blocks

[[block]]
id = "foundation"
name = "Foundation"
from = "2026-11-02"
to = "2027-01-03"
focus = "Learn the movements, pelvis control in every session."
about = "Moderate weights, slow and controlled. Your own favourites stay in, the crunch-type exercises become running-specific core work, and every session has pelvis-control exercises. Single-leg work starts with support (a hand on the wall) and loses it as balance improves."

[[block]]
id = "build"
name = "Build"
from = "2027-01-04"
to = "2027-03-14"
focus = "Heavier single-leg strength, first plyometrics, sideways strength for sand."
about = "Four runs a week now, so the circuits get more specific: rear-foot-elevated split squats make the light bells feel heavy, swings add hip power, pogo hops start the spring work, and side lunges and Copenhagen planks prepare hips and groin for the dunes of Texel."

[[block]]
id = "marathon"
name = "Marathon"
from = "2027-03-15"
to = "2027-05-16"
focus = "Keep the strength, build endurance in calves and hips for 42 km."
about = "Long runs grow to 32 km, so the circuits don't try to add much strength: higher reps for calves and hips (they tire first late in a marathon), single-leg hops to keep the spring, carries for posture. In the peak and taper weeks rounds drop to keep the legs fresh."

[[block]]
id = "ironviking"
name = "Iron Viking"
from = "2027-05-17"
to = "2027-09-26"
focus = "Legs and core first; grip, pushing, pulling and crawling for the obstacles."
about = "Iron Viking is a marathon with obstacles: walls, carries, crawls and hangs. The legs and pelvis work stays, and each circuit adds grip and upper-body work. If you can get to a pull-up bar (a playground works), finish with 3 dead hangs as long as you can hold them."

