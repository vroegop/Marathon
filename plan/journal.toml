title = "Review: the days after the 10k"
body = """Watch export up to 3 November.

- Monday: 15 minutes on the elliptical instead of 30, at a very easy heart rate (average 102). The day after a race that's exactly right; the first elliptical session the watch has recorded.
- Tuesday: the treadmill recovery run and the first strength circuit, from your message.
- Resting heart rate went from 54 before the race to 60-61 on the two days after it: the normal bump after a hard effort. It should settle back within a few days; if it stays up, the next easy days stay extra easy.
- Wednesday's 7 km run comes in with the next export.

No changes: the reset week continues, and the Texel block starts on Monday 9 November."""

[[entry]]
date = "2026-11-09"
kind = "coach"
title = "Reset week review: easy runs drifting into zone 3"
body = """Watch export up to 8 November.

- Wednesday: 7.6 km at 6:05/km. Sunday evening: the 12 km long run, a day early, at 6:06/km. Both went well, but both were faster than easy pace (6:20-6:57/km): half of Wednesday's run and three quarters of Sunday's were in heart-rate zone 3. The old habit of running easy days too hard is creeping back.
- Why it matters: zone 2 builds the engine with little fatigue. Zone 3 adds fatigue without much extra benefit and leaves less in the legs for the sessions that are meant to be hard. With the long runs growing towards 21 km, this matters more every week.
- What to do: set a heart-rate alert on the watch at 149 bpm and slow down, or walk a few steps, whenever it goes off. Easy runs will be around 6:30-6:50/km for now, and that's fine.
- The site now flags an easy run as too hard when most of it is above zone 2, not only when the average is.
- Saturday was a short 2.7 km at a very easy pace: social weekend, no problem.
- This week, with the long run already done: Monday 30 minutes on the elliptical and circuit B, Tuesday the progression run, Wednesday an easy run with a friend and circuit A (no volleyball this week), Thursday and Friday rest, Saturday an easy 5 km and circuit B."""

[[entry]]
date = "2026-11-09"
kind = "coach"
title = "Circuit B, first feedback"
body = """Elliptical and circuit B done, and the knee feels perfect.

- Pogo hops instead of jumping jacks: 40 felt easy, so they replace the jumping jacks for good. January's circuit goes to 2 × 30.
- Kettlebell ab twists felt easy with 7 kg: now 9 kg.
- The side plank with leg lift is the hardest exercise of the lot, and doing it from the knees is the right call. Keep it there until all 8 lifts per side feel controlled. It's hard because it trains exactly the hip muscle that keeps the pelvis level when you land."""

[[entry]]
date = "2026-11-10"
kind = "coach"
title = "A longer easy run on Wednesday"
body = """6 km progression run today, and you're hungry for more: a longer easy run with your friend tomorrow, then two rest days.

- Fine, up to 8 km (9 at most), all of it in zone 2: under 149 bpm, at a pace where you can talk easily. Running with someone usually helps with that.
- Why not a real long run: your longest runs in the last 30 days are 12 km (21 October and Sunday). Single runs well beyond the longest of the past month are what predicts injuries, and Monday's 13 km long run is already the next step up. Three long runs in nine days would also crowd too much into one part of the week.
- It's the day after a quality run, so the legs aren't fresh. Thursday and Friday are rest days, which makes up for it.
- Circuit A afterwards as planned; two rounds instead of three if the legs feel heavy.
- The week comes to about 19 km, under last week's 25: still a light week before the Texel block builds up.
- Being keen to run every day is great. Heart and lungs adapt within weeks, but tendons and bones take months, and they're what the gradual build protects. Use the extra energy on the easy pace, not on extra kilometres."""

[[entry]]
date = "2026-11-14"
kind = "coach"
title = "Week review: the easy pace is back"
body = """Watch export up to 12 November.

- Tuesday: 6.3 km progression run, average HR 149. The finish went into zone 4, as a progression should.
- Wednesday: circuit A first, then 5.6 km with your friend at an average HR of 143, with 80% of the run in zone 2. That's the easiest run in weeks, exactly what easy days should look like. The plan said up to 8 km; 5.6 after a circuit was plenty, so the schedule now shows what you did.
- Resting heart rate 60-65 this week, a little above the 54-57 of quieter weeks. Busy days (20,000 steps on Tuesday) and the race recovery; worth watching, no reason to change anything.
- Next: Saturday an easy 5 km and circuit B, Monday the 13 km long run. Keep it like Wednesday: talking pace, under 149 bpm."""
