[[entry]]
date = "2026-10-26"
kind = "coach"
title = "Easier race week, and the elliptical joins the plan"
body = """This week is two easy runs (Thursday 5 km, Saturday shake-out) instead of a race-pace session, so the knee arrives at Sunday's 10k calm. If it hurts during the warm-up, run the 10k as an easy training run: no result is worth weeks off.

The elliptical and kettlebells at home are a real asset:
- Every easy and recovery run now shows an elliptical alternative (same heart-rate zone, about the same time). Use it whenever the knee or legs feel beaten up, or when the weather is grim.
- Long runs, quality sessions and the race-specific trail runs stay running: bones, tendons and feet only get race-ready from the impact of running, and Texel, the marathon and Iron Viking are all long days on your feet.
- The strength sessions are now a kettlebell circuit (goblet squats, swings, single-leg deadlifts, carries). Strong hips and thighs are the best protection for knees.
- Day after the 10k is an elliptical session instead of a recovery run."""

[[entry]]
date = "2026-10-30"
kind = "life"
title = "Thursday's easy run skipped"
body = """An extra hard volleyball training left the legs tired, so Thursday's easy 5 km didn't happen. In race week that's no problem, and don't make it up: fitness doesn't change in a few days, freshness does.

Saturday's shake-out matters a bit more now, because the last run was last Sunday. Run 4 km very easy and do the 3 strides to wake the legs up.
Tonight's match: play, but skip any extra jumping if you can, and get to bed early. If the knee felt the hard training, use the warm-up check on Sunday."""

[[entry]]
date = "2026-10-30"
kind = "coach"
title = "Strength twice a week, pelvis control and Sunday mobility"
body = """From Tuesday 3 November: two 20-minute circuits a week, each straight after an easy run or the elliptical, plus 15 minutes of mobility on Sundays. The new Strength page has every exercise with how-to and why.

- When: in November and December on Tuesday (after 20-25 min on the elliptical) and Saturday (after the easy run). From January, Tuesday (after the easy run) and Thursday (after the elliptical). The Tuesday elliptical adds aerobic time without extra impact while the knee settles and volleyball is still weekly.
- What: legs, calves and core first, a little upper body. The circuits change with the season in four blocks: Foundation (now), Build (single-leg strength, first hops, sideways strength for Texel's sand), Marathon (endurance for calves and hips) and Iron Viking (grip, carries, crawls).
- Pelvis: every circuit has exercises that hold the pelvis level on one leg (hip hikes, single-leg bridges), steer its rotation over the standing leg (hip airplanes, single-leg deadlifts) and stop the trunk twisting along (Pallof press, dead bugs). Strong hips are also the best protection for the knee.
- Your own circuit is the starting point. Squats, push-ups, single-leg bridges, jumping jacks and kettlebell twists stay. Crunches became dead bugs, side crunches side planks, forward lunges reverse lunges, and two-legged ankle raises single-leg calf raises.
- Lighter weeks get 2 rounds instead of 3. Race weeks get a short, light circuit 4-5 days before the race, or none.
- Mobility: a 4-minute primer before every circuit and a 15-minute routine on Sundays for hips, ankles and upper back."""

[[entry]]
date = "2026-11-01"
kind = "result"
title = "10k: 51:57, and the knee was fine"
body = """51:57 on the watch, over 10.26 km by GPS. The course is 10 km; watches measure a little long because you don't run the shortest line through every bend. If the official chip time differs, the plan is updated with it.

Very even pacing: every kilometre between 4:44 and 5:09, a small dip at 8-9 km and a strong last kilometre. Heart rate climbed steadily from 173 to 184 (max 186): a real race effort. The heart rate for the first 11 minutes reads far too low; the sensor took a while to lock on, but your cadence shows you were running from the first minute.

Sub-50 didn't happen this time, but the result matches the fitness estimate (52:15 predicted) almost to the second. Fitness score: VDOT 38.3, so training paces get 2-3 seconds per km quicker. And the knee was fine."""

[[entry]]
date = "2026-11-02"
kind = "coach"
title = "Review after the 10k: on to Texel"
body = """Watch export up to 1 November.

- Race week: elliptical on Monday, Thursday skipped (tired legs after volleyball), a shake-out on Saturday at heart rate 132, exactly the easy effort it should be, and the 10k on Sunday. 13.5 of 19 km.
- Easy runs: the last three (21, 25 and 31 October) were mostly in zones 1-2. The old habit of running easy days too hard is fading; keep it that way.
- Resting heart rate is steady at 54-61.
- Texel outlook: at today's fitness, 24 km of beach and dunes works out at about 2:25 (around 2:12 on the road plus about 10% for sand), right at the 6:00/km goal. Thirteen weeks of steady training normally adds one or two VDOT points, which puts the goal well within reach. It stays.
- Plan: no changes. The knee was fine after the race, so the Texel block starts as planned: an easy week now (elliptical today, the first strength circuit tomorrow), long runs from Monday 9 November."""

[[entry]]
date = "2026-11-03"
kind = "life"
title = "First circuit done; no volleyball this week"
body = """Tuesday: the first strength circuit is done, with a 20-minute recovery run on the treadmill instead of the elliptical.

Volleyball is off this week (Wednesday training and Friday's match), and the legs feel good after the 10k. So Thursday's easy run with strides moves to Wednesday and grows to 7 km.
- Keep it easy (zone 2) with relaxed strides at the end. Three days after a 10k the muscles are still repairing even when they feel fresh, so harder running waits for next week's progression run.
- Thursday: an optional 30 minutes on the elliptical. Friday: rest. Saturday as planned, social weekend permitting."""

[[entry]]
date = "2026-11-03"
kind = "coach"
title = "A science check, and smoother long runs"
body = """The plan was checked against the research. Most of it holds up: mostly easy running with one harder session a week suits recreational runners, the three-week marathon taper matches what works best in large studies, and the strength work includes the hops that improve running economy and the hip work that helps knees.

One thing changed. A 2025 study of 5,200 runners (Frandsen et al., British Journal of Sports Medicine) found that injury risk rises when a single run is more than 10% longer than the longest run of the previous 30 days; weekly totals mattered less. Eight long runs broke that rule, so the long runs now grow in smaller steps:
- Texel block: 12, 13, 14, 11, 15, 16, 14, 17, 18, 19, 16 and 21 km, then the race. The 22 km in January (a 22% jump) is gone.
- Marathon block: the peak becomes 30 km instead of 32 (24, 26, 28 and 30 km in March and April). That also keeps the longest run near 3¼ hours instead of 3½.
- Races themselves are the exception: they're meant to be longer than anything before them.
- The Iron Viking block gets the same treatment after the marathon, when fitness is clearer."""

[[entry]]
date = "2026-11-04"
kind = "coach"
title = "Sand repeats instead of hills"
body = """There's no hill near home, so every hill session becomes sand repeats: short hard efforts in soft, dry beach sand, jogging back on the firm sand by the water.

- Soft sand makes each stride work like a hill (more energy, more push from calves, glutes and hips) with less impact, which suits the knee.
- For Texel, on beach and dunes, it's the most race-specific session in the plan.
- Run by effort and heart rate (zone 4 on the reps); pace means nothing in sand.
- Calves and Achilles work much harder in sand. The first session (26 November) stops at 4 or 5 reps if they complain."""

[[entry]]
date = "2026-11-05"
